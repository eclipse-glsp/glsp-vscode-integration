name: 'Publish to NPM'

on:
  workflow_run:
    workflows: ['CI']
    types:
      - completed
    branches: [master]
  workflow_call:
    inputs:
      ref:
        description: 'Git ref (branch, tag, or commit SHA) to checkout and publish'
        required: true
        type: string
      dist-tag:
        description: 'NPM dist-tag to use for publishing'
        required: false
        type: string
        default: 'next'
      full:
        description: 'Publish all packages, ignoring the affected-only baseline (next only)'
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (branch, tag, or commit SHA) to checkout and publish'
        required: true
        type: string
      dist-tag:
        description: 'NPM dist-tag to use for publishing'
        required: false
        type: choice
        options:
          - next
          - latest
        default: 'next'
      full:
        description: 'Publish all packages, ignoring the affected-only baseline (next only)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build & Publish
    runs-on: ubuntu-22.04
    if: github.repository == 'eclipse-glsp/glsp-vscode-integration' && (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success'))
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.ref || github.event.inputs.ref || github.event.workflow_run.head_commit.id || github.sha }}
          # Fetch all history to determine the canary version
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.x
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - name: Build
        run: pnpm compile
      - name: Publish to NPM
        run: |
          DIST_TAG="${{ inputs.dist-tag || github.event.inputs.dist-tag || 'next' }}"
          if [[ "$DIST_TAG" == "next" ]]; then
            FULL_FLAG=""
            if [[ "${{ inputs.full }}" == "true" ]]; then
              FULL_FLAG="--full"
            fi
            # affected-only publish: the CLI publishes the package groups changed by the last commit
            pnpm publish:next $FULL_FLAG
          elif [[ "$DIST_TAG" == "latest" ]]; then
            pnpm publish:latest
          else
            echo "Unknown dist-tag: $DIST_TAG"
            exit 1
          fi
        env:
          NPM_CONFIG_PROVENANCE: 'true'
