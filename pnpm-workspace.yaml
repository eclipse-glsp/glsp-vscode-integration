packages:
    - 'packages/*'
    - 'example/workflow/*'

# Security overrides: force patched versions of transitive (dev/tooling-only) dependencies that
# upstream tooling still pins to ranges flagged by `pnpm audit`.
overrides:
    # serialize-javascript RCE via RegExp.flags/Date.toISOString (GHSA-76p7-773f-r4q5 high) +
    # CPU-exhaustion DoS (GHSA-h333-g9bf-3qmv moderate); pulled by mocha.
    serialize-javascript: '>=7.0.5'
    # js-yaml quadratic-complexity DoS in merge-key handling (GHSA-h67p-54hq-rp68); pulled via nyc>load-nyc-config.
    js-yaml: '>=4.1.2'
    # jsdiff ReDoS (GHSA-73rr-hh4g-fpgx); pulled by mocha (declares ^7, fix is in >=8.0.3).
    diff: '>=8.0.3'
    # markdown-it quadratic-complexity DoS in smartquotes (GHSA-6v5v-wf23-fmfq); pulled by @vscode/vsce.
    markdown-it: '>=14.1.2'

# Tooling (eslint, prettier, mocha, ts-node, rimraf, @eclipse-glsp/*-config, ...) is provided
# as transitive deps of @eclipse-glsp/dev and must resolve from the workspace root
# (tsconfig `extends`, lint/test/build bins). Public-hoist only the dev tooling; app/runtime
# deps stay strictly isolated. pnpm >=11 no longer reads non-auth settings from .npmrc, so
# this lives here.
publicHoistPattern:
    - '@eclipse-glsp/*config*'
    - '@eclipse-glsp/cli'
    - 'eslint'
    - 'eslint-*'
    - '@typescript-eslint/*'
    - 'prettier'
    - 'prettier-plugin-*'
    - 'mocha'
    - 'chai'
    - 'sinon'
    - 'ts-node'
    - 'rimraf'
    - 'nyc'
    - '@types/*' # type stubs are compile-time-only; hoist so `@types/<x>` resolves at root
    - '@vscode/vsce'
    - 'vsce'

# Deps allowed to run install/build scripts (pnpm >=11 replaces onlyBuiltDependencies).
# @vscode/vsce-sign and keytar are native deps required by @vscode/vsce for extension packaging.
allowBuilds:
    '@vscode/vsce-sign': true
    esbuild: true
    keytar: true
    unrs-resolver: true

# Min age (minutes) of dependency versions to install — supply-chain hardening. 4320 = 72h.
minimumReleaseAge: 4320
minimumReleaseAgeIgnoreMissingTime: false
# First-party packages are consumed as fresh nightlies (next tag), not a supply-chain risk —
# exempt them from the age gate.
minimumReleaseAgeExclude:
    - '@eclipse-glsp/*'
    - '@eclipse-glsp-examples/*'
